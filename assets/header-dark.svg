<title>Hoan Tran: I build AI agents that work for people, on the road to AGI that helps humanity.</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
  .label { animation: fade .4s ease-out both; }
  .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .cursor { animation: sweep 2.6s cubic-bezier(.4,0,.2,1) .3s both; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes sweep { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateX(612px); opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
