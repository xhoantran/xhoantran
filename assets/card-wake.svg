<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" role="img" aria-label="wake: See what ChatGPT, Claude and Perplexity read on your website, and which sales those agent visits lead to.">
<title>wake: See what ChatGPT, Claude and Perplexity read on your website, and which sales those agent visits lead to.</title>
<defs>
  <clipPath id="frame"><rect width="440" height="190" rx="16"/></clipPath>
  <filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="haze" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0">
  <stop offset="0" stop-color="#a78bfa"/><stop offset=".3" stop-color="#23233a"/><stop offset=".7" stop-color="#23233a"/><stop offset="1" stop-color="#f4f4fb"/>
  <animateTransform attributeName="gradientTransform" type="rotate" from="0 220 95" to="360 220 95" dur="9s" repeatCount="indefinite"/>
</linearGradient>
  <radialGradient id="cglow"><stop offset="0" stop-color="#a78bfa" stop-opacity=".32"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .orb { transform-box: fill-box; transform-origin: center; animation: orb 7s ease-in-out infinite; }
  @keyframes orb { 50% { transform: translate(-24px, 14px) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
<rect width="440" height="190" fill="#0b0b14"/>
<circle class="orb" cx="390" cy="20" r="150" fill="url(#cglow)"/>
<text class="sans" x="416" y="72" font-size="74" font-weight="800" fill="url(#num)" text-anchor="end" letter-spacing="-.04em">02</text>
<circle cx="30" cy="34" r="4" fill="#a78bfa" filter="url(#glow)"/>
<text class="mono" x="44" y="38" font-size="11" fill="#9a9ab8" letter-spacing=".08em">github.com/xhoantran</text>
<text class="mono" x="24" y="76" font-size="21" font-weight="700" fill="#f4f4fb">wake</text>
<text class="sans" x="24" y="106" font-size="13.5" fill="#9a9ab8">See what ChatGPT, Claude and Perplexity read on your</text>
<text class="sans" x="24" y="126" font-size="13.5" fill="#9a9ab8">website, and which sales those agent visits lead to.</text>
<circle cx="30" cy="166" r="5" fill="#f1e05a"/>
<text class="mono" x="42" y="170" font-size="12" fill="#9a9ab8">JavaScript</text>

</g>
<rect x=".5" y=".5" width="439" height="189" rx="16" fill="none" stroke="url(#edge)" stroke-width="1"/>
</svg>
